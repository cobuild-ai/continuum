[project]
name = "continuum-vibe"
version = "0.1.0"
description = "Continuum: Mobile-First Vibe Coding & Host Sandbox Orchestration Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Smilelife & AI Co-Engineers", email = "deartalkai.dev@gmail.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
continuum = "vibe_server.main:cli_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibe_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
